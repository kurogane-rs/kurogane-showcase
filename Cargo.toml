[package]
name = "kurogane-showcase"
version = "0.1.0"
description = "A Rust-controlled GPU showcase composing three live Chromium panes with Kurogane in a single event loop."
edition = "2024"
publish = false

[dependencies]
kurogane = { git = "https://github.com/0x48piraj/kurogane", tag = "v0.0.6-alpha.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std", "tracing-log"] }
wgpu = "30"
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links", "x11"] }
egui-wgpu = { version = "0.36", default-features = false, features = ["winit", "x11"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }

[workspace]
